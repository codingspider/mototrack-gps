apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 on release builds: removes unused Java/Kotlin code and shortens names (minify), then removes unused resources
 * (shrinkResources). Makes the download smaller. Our own rules are in proguard-rules.pro; resources that are only
 * looked up by name are kept by res/raw/keep.xml. R8 writes build/outputs/mapping/release/mapping.txt, which Google
 * Play uses (it is inside the .aab) to turn crash reports back into readable class names.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Google Maps key: put  GOOGLE_MAPS_API_KEY=your_key  in the .env file in the project root (git-ignored).
// Change it there any time, then rebuild the app. Fallbacks: android/local.properties, then the
// GOOGLE_MAPS_API_KEY environment variable. Never write the key in a committed file.
def readEnvFileValue = { String name ->
    def envFile = new File(rootProject.projectDir.parentFile, '.env')
    if (!envFile.exists()) {
        return null
    }
    def value = null
    envFile.eachLine { line ->
        def text = line.trim()
        if (text.startsWith(name + '=')) {
            value = text.substring(name.length() + 1).trim().replaceAll('^["\']|["\']$', '')
        }
    }
    return value
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def googleMapsApiKey = readEnvFileValue('GOOGLE_MAPS_API_KEY') ?: localProperties.getProperty('GOOGLE_MAPS_API_KEY') ?: System.getenv('GOOGLE_MAPS_API_KEY') ?: 'MISSING_GOOGLE_MAPS_KEY'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mototrackpro"
    defaultConfig {
        applicationId "com.mototrackpro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode = major * 10000 + minor * 100 + patch (2.0.1 -> 20001). It must go up with every Play Store upload.
        versionCode 20002
        versionName "2.0.2"
        manifestPlaceholders = [googleMapsApiKey: googleMapsApiKey]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The upload key for Google Play. Its four values are NOT in the repo: put them in
        // ~/.gradle/gradle.properties (or android/gradle.properties on your own machine, never committed):
        //   MOTOTRACK_UPLOAD_STORE_FILE=mototrack-upload.keystore   (a file in android/app/, or a full path)
        //   MOTOTRACK_UPLOAD_KEY_ALIAS=mototrack
        //   MOTOTRACK_UPLOAD_STORE_PASSWORD=...
        //   MOTOTRACK_UPLOAD_KEY_PASSWORD=...
        release {
            if (project.hasProperty('MOTOTRACK_UPLOAD_STORE_FILE')) {
                storeFile file(MOTOTRACK_UPLOAD_STORE_FILE)
                storePassword MOTOTRACK_UPLOAD_STORE_PASSWORD
                keyAlias MOTOTRACK_UPLOAD_KEY_ALIAS
                keyPassword MOTOTRACK_UPLOAD_KEY_PASSWORD
            }
        }
    }
    // APKs to share by hand (WhatsApp, Drive, website): build with  npm run apk:share  (see package.json).
    // Real phones use only two processor types: arm64-v8a (almost every phone since about 2017) and armeabi-v7a
    // (older and cheap phones). x86 / x86_64 are only emulators and a few Chromebooks, so shared APKs leave them out.
    // This makes three files in android/app/build/outputs/apk/release/:
    //   app-universal-release.apk    both phone types in one file: SHARE THIS ONE, it installs on every phone
    //   app-arm64-v8a-release.apk    smallest, for modern phones only
    //   app-armeabi-v7a-release.apk  for old 32-bit phones only
    // Without -PshareApk nothing changes (the Play Store .aab and debug builds work as before).
    splits {
        abi {
            enable project.hasProperty('shareApk')
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the upload key when it is configured (see signingConfigs.release above). Without it the build
            // still works for local testing, signed with the debug key: Google Play REJECTS such a file.
            if (project.hasProperty('MOTOTRACK_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                logger.warn('MOTOTRACK_UPLOAD_STORE_FILE is not set: the release build is signed with the DEBUG key and cannot be uploaded to Google Play.')
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Symbol table of the native (C++) libraries, so Google Play can also read native crash reports.
            // It goes into the .aab only, not into what customers download.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Google Play in-app updates: the forced "Update now" screen (see AppUpdateModule.kt)
    implementation("com.google.android.play:app-update:2.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Firebase push notifications. Only applied when google-services.json is present,
// so the app still builds (without push) before the file is added.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("android/app/google-services.json not found: push notifications are disabled in this build")
}
